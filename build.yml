# ====== শুধু নিচের লাইনে নিজের গোপন পাসওয়ার্ড বদলান (ইংরেজি অক্ষর/সংখ্যা, স্পেস ছাড়া) ======
name: Build CCTV APK

on:
  workflow_dispatch:
  push:

env:
  CCTV_KEY: myPassword123

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Create project files
        run: |
          mkdir -p .
          cat > settings.gradle.kts << 'FILE_END'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MyCCTV"
          include(":app")
          FILE_END
          mkdir -p .
          cat > build.gradle.kts << 'FILE_END'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          FILE_END
          mkdir -p .
          cat > gradle.properties << 'FILE_END'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          FILE_END
          mkdir -p app
          cat > app/build.gradle.kts << 'FILE_END'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.cctv"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.example.cctv"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.appcompat:appcompat:1.7.0")
          }
          FILE_END
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'FILE_END'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />

              <application
                  android:label="My CCTV"
                  android:theme="@style/Theme.AppCompat.DayNight.DarkActionBar"
                  android:usesCleartextTraffic="true">

                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".CamService"
                      android:exported="false"
                      android:foregroundServiceType="camera" />
              </application>
          </manifest>
          FILE_END
          mkdir -p app/src/main/java/com/example/cctv
          cat > app/src/main/java/com/example/cctv/MainActivity.kt << 'FILE_END'
          package com.example.cctv

          import android.Manifest
          import android.content.Context
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.text.format.Formatter
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {

              private lateinit var info: TextView

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(40, 40, 40, 40)
                  }
                  info = TextView(this).apply { textSize = 18f; gravity = Gravity.CENTER }
                  val start = Button(this).apply { text = "ক্যামেরা চালু করুন" }
                  val stop = Button(this).apply { text = "বন্ধ করুন" }
                  layout.addView(info); layout.addView(start); layout.addView(stop)
                  setContentView(layout)

                  start.setOnClickListener { askPermissionsThenStart() }
                  stop.setOnClickListener {
                      stopService(Intent(this, CamService::class.java))
                      info.text = "বন্ধ আছে"
                  }
                  info.text = "চালু করতে বাটন চাপুন"
              }

              private fun askPermissionsThenStart() {
                  val perms = mutableListOf(Manifest.permission.CAMERA)
                  if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
                  val missing = perms.filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (missing.isEmpty()) startCam() else ActivityCompat.requestPermissions(this, missing.toTypedArray(), 1)
              }

              override fun onRequestPermissionsResult(r: Int, p: Array<out String>, g: IntArray) {
                  super.onRequestPermissionsResult(r, p, g)
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED) startCam()
                  else info.text = "ক্যামেরার অনুমতি দিতে হবে"
              }

              private fun startCam() {
                  ContextCompat.startForegroundService(this, Intent(this, CamService::class.java))
                  @Suppress("DEPRECATION")
                  val ip = Formatter.formatIpAddress(
                      (applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager).connectionInfo.ipAddress
                  )
                  info.text = "চালু আছে ✅\n\nঅন্য ফোনের ব্রাউজারে খুলুন:\nhttp://$ip:${CamService.PORT}/?key=${CamService.KEY}\n\nএখন স্ক্রিন বন্ধ করলেও চলবে।"
              }
          }
          FILE_END
          mkdir -p app/src/main/java/com/example/cctv
          cat > app/src/main/java/com/example/cctv/CamService.kt << 'FILE_END'
          package com.example.cctv

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.Matrix
          import android.os.Build
          import android.os.IBinder
          import androidx.camera.core.CameraSelector
          import androidx.camera.core.ImageAnalysis
          import androidx.camera.core.ImageProxy
          import androidx.camera.lifecycle.ProcessCameraProvider
          import androidx.core.app.NotificationCompat
          import androidx.core.content.ContextCompat
          import androidx.lifecycle.LifecycleService
          import java.io.ByteArrayOutputStream
          import java.net.ServerSocket
          import java.net.Socket
          import java.util.concurrent.Executors

          class CamService : LifecycleService() {

              companion object {
                  const val PORT = 8080
                  // নিজের গোপন পাসওয়ার্ড দিন (শুধু ইংরেজি অক্ষর/সংখ্যা):
                  const val KEY = "__KEY__"
                  @Volatile var lastJpeg: ByteArray? = null
              }

              private val executor = Executors.newSingleThreadExecutor()
              private var server: ServerSocket? = null
              @Volatile private var running = true
              private var lastFrameTime = 0L

              override fun onCreate() {
                  super.onCreate()
                  startAsForeground()
                  startCamera()
                  startServer()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(NotificationChannel("cctv", "CCTV", NotificationManager.IMPORTANCE_LOW))
                  }
                  val n: Notification = NotificationCompat.Builder(this, "cctv")
                      .setContentTitle("সিসি ক্যামেরা চালু আছে")
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 29)
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA)
                  else startForeground(1, n)
              }

              private fun startCamera() {
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      val provider = future.get()
                      val analysis = ImageAnalysis.Builder()
                          .setTargetResolution(android.util.Size(640, 480))   // ছোট রেজোলিউশন = কম ব্যাটারি
                          .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                          .build()
                      analysis.setAnalyzer(executor) { img -> processFrame(img) }
                      provider.unbindAll()
                      provider.bindToLifecycle(this, CameraSelector.DEFAULT_BACK_CAMERA, analysis)
                  }, ContextCompat.getMainExecutor(this))
              }

              private fun processFrame(img: ImageProxy) {
                  try {
                      val now = System.currentTimeMillis()
                      if (now - lastFrameTime < 120) return          // প্রায় ৮ ফ্রেম/সেকেন্ড
                      lastFrameTime = now
                      var bmp = img.toBitmap()
                      if (img.imageInfo.rotationDegrees != 0) {
                          val m = Matrix().apply { postRotate(img.imageInfo.rotationDegrees.toFloat()) }
                          bmp = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                      }
                      val out = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 60, out)
                      lastJpeg = out.toByteArray()
                  } finally {
                      img.close()
                  }
              }

              private fun startServer() {
                  Thread {
                      try {
                          server = ServerSocket(PORT)
                          while (running) {
                              val s = server!!.accept()
                              Thread { handle(s) }.start()
                          }
                      } catch (_: Exception) {}
                  }.start()
              }

              private fun handle(s: Socket) {
                  try {
                      val reader = s.getInputStream().bufferedReader()
                      val request = reader.readLine() ?: return
                      val out = s.getOutputStream()
                      if (!request.contains("key=$KEY")) {
                          out.write("HTTP/1.1 403 Forbidden\r\nContent-Length: 0\r\n\r\n".toByteArray())
                          return
                      }
                      if (request.startsWith("GET /stream")) {
                          out.write(("HTTP/1.1 200 OK\r\nContent-Type: multipart/x-mixed-replace; boundary=frame\r\n" +
                                  "Cache-Control: no-cache\r\n\r\n").toByteArray())
                          while (running) {
                              val jpg = lastJpeg
                              if (jpg != null) {
                                  out.write("--frame\r\nContent-Type: image/jpeg\r\nContent-Length: ${jpg.size}\r\n\r\n".toByteArray())
                                  out.write(jpg); out.write("\r\n".toByteArray()); out.flush()
                              }
                              Thread.sleep(120)
                          }
                      } else {
                          val html = "<html><body style='margin:0;background:#000'>" +
                                  "<img src='/stream?key=$KEY' style='width:100%'></body></html>"
                          out.write(("HTTP/1.1 200 OK\r\nContent-Type: text/html\r\nContent-Length: ${html.toByteArray().size}\r\n\r\n$html").toByteArray())
                      }
                  } catch (_: Exception) {
                  } finally { try { s.close() } catch (_: Exception) {} }
              }

              override fun onBind(intent: Intent): IBinder? { super.onBind(intent); return null }

              override fun onDestroy() {
                  running = false
                  try { server?.close() } catch (_: Exception) {}
                  super.onDestroy()
              }
          }
          FILE_END

          sed -i "s/__KEY__/$CCTV_KEY/" app/src/main/java/com/example/cctv/CamService.kt

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: MyCCTV-apk
          path: app/build/outputs/apk/debug/app-debug.apk
